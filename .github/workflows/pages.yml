name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft immer nur eine Veröffentlichung gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Kein `npm ci`: die Sperrdatei entsteht unter Windows und npm laesst
      # dort die Zusatzpakete weg, die Sharp nur unter Linux braucht
      # (@emnapi/core, @emnapi/runtime). `npm ci` bricht deswegen ab.
      - run: npm install --no-audit --no-fund
      # Die Seite liegt unter benutzername.github.io/name-des-repos,
      # deshalb muss der Unterordner vor alle Verweise.
      - run: npm run build:pages -- --basis ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
